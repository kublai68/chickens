<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Example</title>
  <style>
    body {
      background-color: #f0f8ff; /* Light blue background */
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #1e90ff; /* DodgerBlue */
    }
    p {
      color: #333; /* Dark gray text */
      background-color: #fffacd; /* LemonChiffon background */
      padding: 10px;
      border: 2px solid #ffa500; /* Orange border */
      border-radius: 5px;
    }
    .highlight {
      color: white;
      background-color: #32cd32; /* LimeGreen */
      padding: 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <h1>Welcome to the Color Demo</h1>

  <p>This paragraph has a light yellow background and an orange border.</p>

  <p class="highlight">This text is highlighted with lime green background and white text.</p>

</body>
</html>
